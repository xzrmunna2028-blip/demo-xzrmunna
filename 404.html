<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Redirecting…</title><script>/* /admin fallback: যে কোনো হোস্টে ডোমেইনের শেষে /admin লিখলেই অ্যাডমিন খুলবে */(function(){var p=location.pathname;if(/\/admin\/?$/i.test(p)){location.replace(p.replace(/admin\/?$/i,"admin.html")+location.search+location.hash)}})();</script><script>if(!/\/admin\/?$/i.test(location.pathname))location.replace(location.pathname.replace(/[^\/]*$/,"")||"/")</script></head><body style="font-family:sans-serif;text-align:center;padding:40px">Redirecting…</body></html>
